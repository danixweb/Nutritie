<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioTracker Pro Ultra V31</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { background-color: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; }
        .tab-content { display: none; height: calc(100dvh - 70px); overflow-y: auto; padding: 1rem; }
        .tab-content.active { display: block; }
        .active-nav { color: #3b82f6; border-bottom: 3px solid #3b82f6; background: rgba(59, 130, 246, 0.05); }
        input, select { background: #0f172a; border: 1px solid #1e293b; color: white; padding: 0.75rem; border-radius: 0.75rem; width: 100%; outline: none; transition: border 0.2s; }
        input:focus { border-color: #3b82f6; }
        .card { background: rgba(30, 41, 59, 0.4); border: 1px solid #1e293b; border-radius: 1rem; padding: 1.25rem; }
        .btn { padding: 0.8rem; border-radius: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; cursor: pointer; text-align: center; font-size: 0.75rem; }
        .btn:active { transform: scale(0.96); }
        .btn-icon { padding: 0.4rem; border-radius: 0.5rem; transition: background 0.2s; cursor: pointer; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); }
        .progress-ring { transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 0.3s linear; }
    </style>
</head>
<body class="flex flex-col">

    <!-- Navigare -->
    <nav class="flex bg-slate-900 border-b border-slate-800 text-[10px] font-black uppercase z-20 shadow-lg">
        <a href="index.html" class="p-4 text-rose-400 border-r border-slate-800 hover:bg-slate-800 flex items-center justify-center gap-1 font-bold">🏠 MetabolicPro</a>
        <button onclick="showTab('timer')" id="nav-timer" class="flex-1 p-4 active-nav">⏱️ Pauză</button>
        <button onclick="showTab('data')" id="nav-data" class="flex-1 p-4">🩺 Date</button>
        <button onclick="showTab('charts')" id="nav-charts" class="flex-1 p-4">📈 Evoluție</button>
        <button onclick="showTab('files')" id="nav-files" class="flex-1 p-4">📂 Dosar</button>
        <button onclick="showTab('ai')" id="nav-ai" class="flex-1 p-4 text-blue-400">✨ AI</button>
    </nav>

    <main class="flex-1 relative">
        <!-- TAB REPAUS -->
        <div id="tab-timer" class="tab-content active">
            <div class="flex flex-col items-center justify-center h-full space-y-6">
                <div class="text-center">
                    <h2 class="text-2xl font-black text-blue-400 tracking-widest uppercase">Repaus</h2>
                    <p class="text-xs text-slate-500 italic mt-1">Stabiliți durata și relaxați-vă</p>
                </div>
                <div class="relative flex items-center justify-center">
                    <svg width="220" height="220">
                        <circle cx="110" cy="110" r="100" stroke="#1e293b" stroke-width="8" fill="transparent" />
                        <circle id="timerCircle" cx="110" cy="110" r="100" stroke="#3b82f6" stroke-width="8" fill="transparent" stroke-dasharray="628" stroke-dashoffset="0" class="progress-ring" stroke-linecap="round" />
                    </svg>
                    <div id="timerDisplay" class="absolute text-5xl font-black">05:00</div>
                </div>
                <div class="w-full max-w-xs space-y-4">
                    <select id="timerDuration" onchange="resetTimer()">
                        <option value="60">1 Minut</option>
                        <option value="180">3 Minute</option>
                        <option value="300" selected>5 Minute</option>
                        <option value="600">10 Minute</option>
                    </select>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="toggleTimer()" id="timerBtn" class="btn bg-blue-600 text-white shadow-lg uppercase">Start</button>
                        <button onclick="closeApp()" class="btn bg-slate-800 text-red-500 border border-red-900/30 uppercase">Închide Pagina</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB DATE -->
        <div id="tab-data" class="tab-content">
            <div class="max-w-md mx-auto space-y-4">
                <div id="editBadge" class="hidden bg-amber-500/20 border border-amber-500/50 p-3 rounded-xl text-[10px] text-amber-500 font-black text-center uppercase tracking-widest">
                    ✏️ Editare Înregistrare &bull; <button onclick="cancelEdit()" class="underline font-black">Anulează</button>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-500 uppercase px-1">Pacient</label>
                    <input type="text" id="pacientName" placeholder="NUME PACIENT" oninput="updateName(this.value)" class="text-lg font-bold">
                </div>
                <div class="card border-l-4 border-l-emerald-500 space-y-4 shadow-xl">
                    <h3 class="text-xs font-black text-emerald-400 uppercase tracking-widest flex items-center gap-2">🩺 Tensiune & Biometrie</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-[8px] text-slate-500 font-black uppercase">Sist</label><input type="number" id="sys"></div>
                        <div><label class="text-[8px] text-slate-500 font-black uppercase">Diast</label><input type="number" id="dia"></div>
                        <div><label class="text-[8px] text-slate-500 font-black uppercase">Puls</label><input type="number" id="pulse"></div>
                        <div><label class="text-[8px] text-slate-500 font-black uppercase">Vârstă</label><input type="number" id="age"></div>
                        <div><label class="text-[8px] text-slate-500 font-black uppercase">Cm</label><input type="number" id="height"></div>
                        <div><label class="text-[8px] text-slate-500 font-black uppercase">Kg</label><input type="number" id="weight"></div>
                    </div>
                    <button onclick="saveEntry('BP')" id="btnSaveBP" class="w-full btn bg-emerald-600 text-white shadow-md">Salvează Date</button>
                </div>
                <div class="card border-l-4 border-l-blue-500 space-y-4 shadow-xl">
                    <h3 class="text-xs font-black text-blue-400 uppercase tracking-widest flex items-center gap-2">👣 Indice ABI</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2"><p class="text-[9px] font-bold text-blue-400 uppercase">Dreapta</p><input type="number" id="abi_leg_d" placeholder="Gleznă"><input type="number" id="abi_arm_d" placeholder="Braț"></div>
                        <div class="space-y-2"><p class="text-[9px] font-bold text-indigo-400 uppercase">Stânga</p><input type="number" id="abi_leg_s" placeholder="Gleznă"><input type="number" id="abi_arm_s" placeholder="Braț"></div>
                    </div>
                    <button onclick="saveEntry('ABI')" id="btnSaveABI" class="w-full btn bg-blue-600 text-white shadow-md">Salvează ABI</button>
                </div>
            </div>
        </div>

        <!-- TAB GRAFICE -->
        <div id="tab-charts" class="tab-content">
            <div class="max-w-4xl mx-auto h-full flex flex-col space-y-4">
                <div class="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-800 shadow-lg">
                    <button onclick="setChartMode('BP')" id="btn-chart-bp" class="flex-1 p-2 text-[10px] font-bold rounded-lg bg-blue-600 text-white uppercase">TA & Puls</button>
                    <button onclick="setChartMode('ABI')" id="btn-chart-abi" class="flex-1 p-2 text-[10px] font-bold rounded-lg text-slate-500 uppercase">Indice ABI</button>
                </div>
                <div class="flex-1 bg-slate-950 p-4 rounded-3xl border border-slate-900 shadow-inner">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </div>

        <!-- TAB DOSAR -->
        <div id="tab-files" class="tab-content">
            <div class="max-w-md mx-auto space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="openLocalFile()" class="btn bg-slate-800 text-blue-400 border border-slate-700">📂 Deschide .PLAC</button>
                    <button onclick="saveLocalFile()" class="btn bg-slate-800 text-emerald-400 border border-slate-700">💾 Salvează .PLAC</button>
                </div>
                <button onclick="exportFullPDF()" class="w-full btn bg-white text-black shadow-2xl py-4 font-black uppercase">📄 Export PDF Portrait (Portrait)</button>
                <div id="recordsList" class="space-y-3 pt-6"></div>
            </div>
        </div>

        <!-- TAB AI -->
        <div id="tab-ai" class="tab-content">
            <div class="max-w-2xl mx-auto h-full flex flex-col space-y-4">
                <div class="card space-y-2 shadow-lg">
                    <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Cheie Gemini API</label>
                    <input type="password" id="apiKey" placeholder="API Key..." oninput="saveKey(this.value)">
                </div>
                <div id="aiResponse" class="flex-1 card overflow-y-auto text-sm leading-tight text-slate-300 bg-slate-950 shadow-inner border-slate-800">
                    Așteptare date reale pentru analiza clinică...
                </div>
                <button onclick="runAi()" id="aiBtn" class="w-full btn bg-indigo-600 text-white py-4 shadow-xl active:scale-95 transition-all">Generează Raport AI Complet</button>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-6 right-6 bg-blue-600 text-white p-4 rounded-2xl text-[10px] font-black uppercase text-center translate-y-20 opacity-0 transition-all duration-500 z-50 shadow-2xl"></div>

    <script>
        let state = { name: '', records: [], chartMode: 'BP' };
        let timer = { time: 300, total: 300, active: false, interval: null };
        let chart = null;
        let editIndex = -1;

        function getBPGradeColor(s, d) {
            s = parseInt(s); d = parseInt(d);
            if (s >= 180 || d >= 110) return '#7f1d1d'; if (s >= 160 || d >= 100) return '#ef4444';
            if (s >= 140 || d >= 90) return '#f97316'; if (s >= 130 || d >= 85) return '#facc15';
            if (s >= 120 || d >= 80) return '#10b981'; return '#22d3ee';
        }

        window.onload = () => {
            const saved = localStorage.getItem('cardiotracker_v31');
            if(saved) {
                state = JSON.parse(saved);
                document.getElementById('pacientName').value = state.name || '';
                autoFillRecent();
            }
            const key = localStorage.getItem('cardio_key');
            if(key) document.getElementById('apiKey').value = key;
            initChart(); renderRecords(); resetTimer();
        };

        function closeApp() {
            if(confirm("Doriți să părăsiți aplicația? Datele nesalvate în fișier .PLAC se pot pierde.")) {
                window.close();
                showToast("Dacă pagina nu s-a închis, vă rugăm să închideți tab-ul manual.");
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; t.style.transform = 'translateY(0)';
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; }, 3000);
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active-nav');
            if(tabId === 'charts') setTimeout(updateChart, 100);
            if(tabId === 'files') renderRecords();
        }

        function resetTimer() {
            clearInterval(timer.interval); timer.active = false;
            timer.total = parseInt(document.getElementById('timerDuration').value);
            timer.time = timer.total; updateTimerUI();
            document.getElementById('timerBtn').innerText = 'Start';
        }

        function toggleTimer() {
            if(timer.active) { clearInterval(timer.interval); timer.active = false; document.getElementById('timerBtn').innerText = 'Continuă'; }
            else {
                timer.active = true; document.getElementById('timerBtn').innerText = 'Stop';
                timer.interval = setInterval(() => {
                    timer.time--; updateTimerUI();
                    if(timer.time <= 0) {
                        clearInterval(timer.interval); timer.active = false;
                        const m = new SpeechSynthesisUtterance("Relaxarea s-a terminat.");
                        m.lang = 'ro-RO'; window.speechSynthesis.speak(m); showTab('data');
                    }
                }, 1000);
            }
        }

        function updateTimerUI() {
            const m = Math.floor(timer.time / 60), s = timer.time % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s.toString().padStart(2,'0')}`;
            const offset = 628 - (timer.time / timer.total * 628);
            document.getElementById('timerCircle').style.strokeDashoffset = offset;
        }

        function updateName(v) { state.name = v.toUpperCase(); save(); }
        function save() { localStorage.setItem('cardiotracker_v31', JSON.stringify(state)); }
        function saveKey(v) { localStorage.setItem('cardio_key', v); }

        async function openLocalFile() {
            try {
                const [h] = await window.showOpenFilePicker({ types: [{ accept: { 'application/json': ['.plac'] } }] });
                const f = await h.getFile(); state = JSON.parse(await f.text());
                document.getElementById('pacientName').value = state.name; autoFillRecent(); save(); renderRecords(); showToast("Dosar deschis.");
            } catch (e) {}
        }

        async function saveLocalFile() {
            try {
                const h = await window.showSaveFilePicker({ suggestedName: (state.name || 'Pacient') + '.plac', types: [{ accept: { 'application/json': ['.plac'] } }] });
                const wr = await h.createWritable(); await wr.write(JSON.stringify(state, null, 2)); await wr.close(); showToast("Salvat.");
            } catch (e) {}
        }

        function autoFillRecent() {
            if(editIndex >= 0) return;
            const lastBP = [...state.records].reverse().find(r => r.type === 'BP');
            if(lastBP) {
                document.getElementById('age').value = lastBP.age || '';
                document.getElementById('height').value = lastBP.height || '';
                document.getElementById('weight').value = lastBP.weight || '';
            }
        }

        function saveEntry(type) {
            if(!state.name) { showToast("Numele este necesar!"); return; }
            let entry = { type, date: editIndex >= 0 ? state.records[editIndex].date : new Date().toISOString() };
            if(type === 'BP') {
                entry.sys = document.getElementById('sys').value; entry.dia = document.getElementById('dia').value;
                entry.pulse = document.getElementById('pulse').value; entry.age = document.getElementById('age').value;
                entry.height = document.getElementById('height').value; entry.weight = document.getElementById('weight').value;
            } else {
                const ld = document.getElementById('abi_leg_d').value, ad = document.getElementById('abi_arm_d').value;
                const ls = document.getElementById('abi_leg_s').value, as = document.getElementById('abi_arm_s').value;
                entry.valD = (ld / ad).toFixed(2); entry.valS = (ls / as).toFixed(2); entry.rawABI = { ld, ad, ls, as };
            }
            if(editIndex >= 0) { state.records[editIndex] = entry; cancelEdit(); }
            else { state.records.push(entry); }
            save(); renderRecords(); showToast("Date salvate!");
        }

        function startEdit(idx) {
            editIndex = idx; const r = state.records[idx]; showTab('data'); document.getElementById('editBadge').classList.remove('hidden');
            if(r.type === 'BP') {
                document.getElementById('sys').value = r.sys; document.getElementById('dia').value = r.dia;
                document.getElementById('pulse').value = r.pulse; document.getElementById('age').value = r.age;
                document.getElementById('height').value = r.height; document.getElementById('weight').value = r.weight;
            } else if(r.rawABI) {
                document.getElementById('abi_leg_d').value = r.rawABI.ld; document.getElementById('abi_arm_d').value = r.rawABI.ad;
                document.getElementById('abi_leg_s').value = r.rawABI.ls; document.getElementById('abi_arm_s').value = r.rawABI.as;
            }
        }

        function cancelEdit() {
            editIndex = -1; document.getElementById('editBadge').classList.add('hidden');
            ['sys','dia','pulse','age','height','weight','abi_leg_d','abi_arm_d','abi_leg_s','abi_arm_s'].forEach(id => document.getElementById(id).value = '');
            autoFillRecent();
        }

        function deleteRecord(idx) { if(confirm("Ștergeți definitiv?")) { state.records.splice(idx, 1); save(); renderRecords(); } }

        function renderRecords() {
            const list = document.getElementById('recordsList');
            if(state.records.length === 0) { list.innerHTML = '<p class="text-center text-slate-700 italic text-[10px] mt-10 uppercase tracking-widest">Istoric gol</p>'; return; }
            list.innerHTML = state.records.map((r, i) => `
                <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl border-l-4 flex justify-between items-center ${r.type==='BP'?'border-l-emerald-500':'border-l-blue-500'}">
                    <div>
                        <div class="text-[7px] font-black text-slate-500 mb-1 tracking-tighter uppercase">${new Date(r.date).toLocaleString('ro-RO')} &bull; ${r.type}</div>
                        <div class="text-[12px] font-bold text-white uppercase">${r.type==='BP' ? `TA: ${r.sys}/${r.dia} | P: ${r.pulse}` : `ABI: ${r.valD} | ${r.valS}`}</div>
                    </div>
                    <div class="flex gap-1"><button onclick="startEdit(${i})" class="btn-icon text-blue-400">✏️</button><button onclick="deleteRecord(${i})" class="btn-icon text-red-500">🗑️</button></div>
                </div>
            `).reverse().join('');
        }

        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line', data: { labels: [], datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 }, maxRotation: 45, minRotation: 45 } },
                        y: { ticks: { color: '#64748b', font: { size: 9 } } }
                    }
                }
            });
        }

        function updateChart() {
            if(!chart) return;
            const filtered = state.records.filter(r => r.type === state.chartMode);
            chart.data.labels = filtered.map(r => {
                const d = new Date(r.date);
                return isNaN(d.getTime()) ? '?' : d.toLocaleDateString('ro-RO', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
            });
            if(state.chartMode === 'BP') {
                chart.data.datasets = [
                    { label: 'Sistolică', data: filtered.map(r => r.sys), borderColor: '#10b981', tension: 0.3, pointRadius: 5, pointBackgroundColor: filtered.map(r => getBPGradeColor(r.sys, r.dia)) },
                    { label: 'Diastolică', data: filtered.map(r => r.dia), borderColor: '#34d399', tension: 0.3, pointRadius: 4, pointBackgroundColor: filtered.map(r => getBPGradeColor(r.sys, r.dia)) },
                    { label: 'Puls', data: filtered.map(r => r.pulse), borderColor: '#f43f5e', borderDash: [5, 5], tension: 0.3, pointRadius: 0 }
                ];
            } else {
                chart.data.datasets = [
                    { label: 'ABI Dreapta', data: filtered.map(r => r.valD), borderColor: '#3b82f6', tension: 0.3, pointRadius: 6 },
                    { label: 'ABI Stânga', data: filtered.map(r => r.valS), borderColor: '#6366f1', tension: 0.3, pointRadius: 6 }
                ];
            }
            chart.update();
        }

        function setChartMode(m) { state.chartMode = m; updateChart(); }

        // --- AI LOGIC V31 ---
        async function runAi() {
            const finalKey = document.getElementById('apiKey').value;
            if(!finalKey) { showToast("Introduceți cheia API!"); return; }
            if(state.records.length === 0) { showToast("Nu există date!"); return; }
            const out = document.getElementById('aiResponse'); out.innerText = "Sistemul analizează datele biometrice...";

            const latestBP = [...state.records].reverse().find(r => r.type === 'BP') || {};
            const h = latestBP.height || 0;
            const w = latestBP.weight || 0;
            const age = latestBP.age || 0;
            const historyTable = state.records.map(r => `[${r.type}] ${new Date(r.date).toLocaleString('ro-RO')}: ${r.type==='BP' ? r.sys+'/'+r.dia : r.valD+'/'+r.valS}`).join('\n');

            const systemPrompt = `Ești medic cardiolog specialist. Pacient: ${state.name}, H: ${h}cm, W: ${w}kg, Age: ${age}.
            CERINȚE:
            1. Calculează IMC.
            2. Analizează evoluția TA și riscul de hipertensiune.
            3. Analizează indicii ABI și riscul vascular.
            4. Recomandări clare de lifestyle și monitorizare.
            FĂRĂ RÂNDURI GOALE. Folosește bold (**Titlu**). Limba română.`;

            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${finalKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "DATE PACIENT:\n" + historyTable }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });
                const res = await resp.json();
                let text = res.candidates?.[0]?.content?.parts?.[0]?.text || "Eroare AI.";
                let compact = text.split('\n').filter(l => l.trim() !== '').join('\n');
                out.innerHTML = compact.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                showToast("Analiză finalizată.");
            } catch(e) { out.innerText = "Eroare: " + e.message; }
        }

        // --- EXPORT PDF PORTRAIT V31 ---
        async function exportFullPDF() {
            showToast("Export PDF Portrait...");
            const canvas = document.createElement('canvas'); canvas.width = 1600; canvas.height = 1000;
            const tempCtx = canvas.getContext('2d');
            new Chart(tempCtx, {
                type: 'line', data: chart.data,
                options: {
                    responsive: false, animation: false, devicePixelRatio: 2,
                    layout: { padding: 40 },
                    scales: { x: { ticks: { color: '#000', font: { size: 16, weight: 'bold' }, maxRotation: 45 } }, y: { ticks: { color: '#000', font: { size: 18, weight: 'bold' } } } },
                    plugins: { legend: { labels: { color: '#000', font: { size: 26, weight: '900' } } } }
                }
            });
            await new Promise(res => setTimeout(res, 2200));
            const imgData = canvas.toDataURL('image/png');
            const aiText = document.getElementById('aiResponse').innerHTML;
            const hasAi = aiText && aiText.length > 50 && aiText !== "Așteptare date...";

            const docElement = document.createElement('div');
            docElement.style.width = '210mm'; docElement.style.padding = '10mm'; docElement.style.boxSizing = 'border-box';
            docElement.style.backgroundColor = '#fff'; docElement.style.color = '#000'; docElement.style.fontFamily = 'Arial, sans-serif';

            docElement.innerHTML = `
                <div style="border-bottom: 6px solid #000; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div><h1 style="font-size: 28px; font-weight: 900; margin: 0;">RAPORT CARDIO</h1><p style="margin: 0; font-size: 14px; color: #444;">Evoluție Biometrică & Analiză AI</p></div>
                    <div style="text-align: right;"><h2 style="margin: 0; font-size: 20px; font-weight: 900;">${state.name || '-'}</h2><p style="margin:0; font-size: 12px;">Data: ${new Date().toLocaleDateString('ro-RO')}</p></div>
                </div>
                <div style="margin-bottom: 25px;"><h3 style="font-size: 16px; font-weight: 900; text-transform: uppercase; border-left: 5px solid #3b82f6; padding-left: 10px; margin-bottom: 10px;">1. Grafic Evolutiv</h3><img src="${imgData}" style="width: 100%; height: auto; border: 1px solid #ddd; padding: 5px;"></div>
